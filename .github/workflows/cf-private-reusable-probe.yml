name: Cloudflare Private Reusable Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cf-private-reusable-probe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    uses: kingaiwork/vps-ops/.github/workflows/cloudflare-reusable-access-probe.yml@ops/cloudflare-reusable-exec-20260820
    secrets: inherit

  record:
    needs: probe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Persist success marker only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ops
          printf '%s\n' '{"access_ok":true,"source":"private-vps-ops-environment","secret_exposed":false}' > ops/cf-reusable-probe-ok.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- ops/cf-reusable-probe-ok.json
          if ! git diff --cached --quiet; then
            git commit -m 'ops: record Cloudflare reusable access probe [skip ci]'
            git push origin HEAD:main
          fi
