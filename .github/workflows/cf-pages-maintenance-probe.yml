name: CF Pages Maintenance Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cf-pages-maintenance-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_ACCOUNT_ID: cc658c266bef011a07f83c73379d47e9
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Verify Cloudflare credential without exposing it
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'CLOUDFLARE_SECRET_MISSING'; exit 2; }
          python3 - <<'PY'
          import json, os, urllib.request
          account=os.environ['CLOUDFLARE_ACCOUNT_ID']
          token=os.environ['CLOUDFLARE_API_TOKEN']
          req=urllib.request.Request(
              f'https://api.cloudflare.com/client/v4/accounts/{account}/pages/projects?per_page=100',
              headers={'Authorization':f'Bearer {token}','User-Agent':'KINGAI-CF-Probe/1.0'})
          with urllib.request.urlopen(req, timeout=30) as r:
              data=json.load(r)
          if data.get('success') is not True:
              raise SystemExit('CLOUDFLARE_API_AUTH_FAILED')
          result=data.get('result') or []
          print(f'CLOUDFLARE_PAGES_READ_OK count={len(result)}')
          PY
