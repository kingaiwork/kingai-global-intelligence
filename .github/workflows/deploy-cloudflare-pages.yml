name: Manual Cloudflare Pages Recovery Deploy

on:
  workflow_dispatch:
    inputs:
      recovery_reason:
        description: 'Why the canonical Git-integrated deployment path needs manual recovery'
        required: true
        type: string

concurrency:
  group: kingai-global-intelligence-manual-recovery
  cancel-in-progress: false

permissions:
  contents: write
  deployments: write

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout canonical public delivery source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require explicit recovery authority
        shell: bash
        env:
          RECOVERY_REASON: ${{ inputs.recovery_reason }}
        run: |
          set -euo pipefail
          test -n "${RECOVERY_REASON:-}" || { echo 'Manual recovery requires a reason.' >&2; exit 2; }
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'Missing CLOUDFLARE_API_TOKEN.' >&2; exit 2; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID.' >&2; exit 2; }

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build and validate public payload
        shell: bash
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund
          npm run build
          test -f dist/index.html
          test -f dist/404.html
          test -d dist/assets
          test -d dist/data
          test ! -e dist/.github
          test ! -e dist/README.md
          test ! -e dist/scripts
          ! grep -R -n -E -- 'kingai-intelligence-core|github_pat_|ghp_|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----' dist
          python3 - <<'PY'
          import json
          from pathlib import Path
          for p in Path('dist/data').rglob('*.json'): json.loads(p.read_text(encoding='utf-8'))
          print('Manual recovery payload validated')
          PY

      - name: Ensure recovery Pages project exists
        id: project
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="${PAGES_PROJECT:-kingai-global-intelligence}"
          echo "name=$PROJECT" >> "$GITHUB_OUTPUT"
          npx wrangler pages project list --json > /tmp/pages.json
          if ! node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('/tmp/pages.json','utf8'));const rows=Array.isArray(p)?p:(p.result||[]);process.exit(rows.some(x=>x.name===process.argv[1])?0:1)" "$PROJECT"; then
            npx wrangler pages project create "$PROJECT" --production-branch main
          fi

      - name: Direct-upload recovery payload
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="${PAGES_PROJECT:-kingai-global-intelligence}"
          npx wrangler pages deploy dist --project-name="$PROJECT" --branch=main --commit-hash="$GITHUB_SHA" --commit-message="Manual recovery: ${{ inputs.recovery_reason }}" 2>&1 | tee /tmp/pages-recovery.log
          URL="$(grep -Eo 'https://[A-Za-z0-9.-]+\.pages\.dev' /tmp/pages-recovery.log | tail -1 || true)"
          if [ -z "$URL" ]; then URL="https://${PROJECT}.pages.dev"; fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Verify canonical production domain
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            code="$(curl -L -sS -o /tmp/intel.html -w '%{http_code}' --connect-timeout 10 --max-time 25 https://intel.kingai.work/ || true)"
            if [ "$code" = 200 ] && grep -Eqi 'KINGAI|Global Intelligence' /tmp/intel.html; then exit 0; fi
            sleep 5
          done
          echo 'Canonical domain smoke failed after manual recovery.' >&2
          exit 4

      - name: Persist sanitized recovery evidence
        if: always()
        shell: bash
        env:
          RECOVERY_REASON: ${{ inputs.recovery_reason }}
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          mkdir -p data
          python3 - <<'PY'
          import json, os, datetime
          doc={'schema_version':'3.0.0','generated_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'environment':'production','deployment_mode':'manual-direct-upload-recovery','canonical_delivery':'cloudflare-pages-git-integration','source_commit':os.environ.get('GITHUB_SHA'),'recovery_reason':os.environ.get('RECOVERY_REASON','')[:500],'pages_url':os.environ.get('DEPLOY_URL') or None,'canonical_domain':'https://intel.kingai.work/','workflow_run_id':os.environ.get('GITHUB_RUN_ID')}
          open('data/deployment-status.json','w',encoding='utf-8').write(json.dumps(doc,ensure_ascii=False,indent=2)+'\n')
          PY
          git config user.name 'KINGAI Deployment Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/deployment-status.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: record manual Pages recovery evidence [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
