name: Deploy Cloudflare Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/deployment-status.json'
  workflow_dispatch:

concurrency:
  group: kingai-cloudflare-pages-production
  cancel-in-progress: true

permissions:
  contents: write
  deployments: write

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Cloudflare credentials
        id: creds
        shell: bash
        run: |
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ] && [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare credentials are not configured for this repository."
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned deployment tooling
        run: npm install --no-audit --no-fund

      - name: Build clean Pages output
        run: npm run build

      - name: Validate Pages payload
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/404.html
          test -d dist/assets
          test -d dist/data
          test ! -e dist/.github
          test ! -e dist/wrangler.jsonc
          test ! -e dist/README.md
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('dist')
          for p in root.rglob('*.json'):
              json.loads(p.read_text(encoding='utf-8'))
          print('Pages payload validated')
          PY

      - name: Ensure Pages project exists
        id: project
        if: steps.creds.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="${PAGES_PROJECT:-kingai-global-intelligence}"
          echo "name=$PROJECT" >> "$GITHUB_OUTPUT"
          npx wrangler pages project list --json > /tmp/pages.json
          if ! node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('/tmp/pages.json','utf8'));const rows=Array.isArray(p)?p:(p.result||[]);process.exit(rows.some(x=>x.name===process.argv[1])?0:1)" "$PROJECT"; then
            npx wrangler pages project create "$PROJECT" --production-branch main
          fi

      - name: Deploy to Cloudflare Pages
        id: deploy
        if: steps.creds.outputs.ready == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          PROJECT="${PAGES_PROJECT:-kingai-global-intelligence}"
          set +e
          npx wrangler pages deploy dist \
            --project-name="$PROJECT" \
            --branch=main \
            --commit-hash="$GITHUB_SHA" \
            --commit-message="${{ github.event.head_commit.message || 'KINGAI Global Intelligence Pages deployment' }}" 2>&1 | tee /tmp/cloudflare-pages-deploy.log
          CODE=${PIPESTATUS[0]}
          set -e
          URL=$(grep -Eo 'https://[A-Za-z0-9.-]+\.pages\.dev' /tmp/cloudflare-pages-deploy.log | tail -1 || true)
          if [ -z "$URL" ]; then URL="https://${PROJECT}.pages.dev"; fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          if [ "$CODE" -ne 0 ]; then exit "$CODE"; fi

      - name: Record deployment status
        if: always()
        shell: bash
        env:
          CREDS_READY: ${{ steps.creds.outputs.ready }}
          PROJECT_NAME: ${{ steps.project.outputs.name }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          DEPLOY_EXIT_CODE: ${{ steps.deploy.outputs.exit_code }}
        run: |
          mkdir -p data
          node <<'NODE'
          const fs=require('fs');
          const doc={
            schema_version:'2.0.0',
            generated_at:new Date().toISOString(),
            environment:'production',
            platform:'cloudflare-pages',
            source_commit:process.env.GITHUB_SHA,
            project:process.env.PROJECT_NAME||process.env.PAGES_PROJECT||'kingai-global-intelligence',
            credentials_configured:process.env.CREDS_READY==='true',
            deployment:{
              outcome:process.env.DEPLOY_OUTCOME||'skipped',
              exit_code:process.env.DEPLOY_EXIT_CODE?Number(process.env.DEPLOY_EXIT_CODE):null,
              pages_url:process.env.DEPLOY_URL||null
            },
            custom_domain:{managed_by_workflow:false}
          };
          fs.writeFileSync('data/deployment-status.json',JSON.stringify(doc,null,2)+'\n');
          NODE

      - name: Commit deployment status
        if: always()
        shell: bash
        run: |
          git config user.name "KINGAI Deployment Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/deployment-status.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: record Cloudflare Pages deployment status [skip ci]"
            git push origin HEAD:main
          fi

      - name: Fail when Pages deployment did not succeed
        if: steps.creds.outputs.ready != 'true' || steps.deploy.outcome != 'success'
        shell: bash
        run: |
          echo "Cloudflare Pages deployment did not succeed. See data/deployment-status.json."
          exit 1
