name: Company public privacy gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  company-public-privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check company-facing documents without exposing matched values
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          docs = [Path("README.md"), Path("PUBLICATION-POLICY.md"), Path("COMPANY.md"), Path("llms.txt")]
          docs.extend(sorted(Path("docs").rglob("*.md")) if Path("docs").exists() else [])
          docs = [p for p in docs if p.is_file()]

          creator_identity = re.compile("jack" + r"[\s._-]*" + "hao" + "|" + "郝" + "才子", re.I)
          personal_email = re.compile(r"(?i)\b[A-Za-z0-9_.+%-]+@(?:gmail|outlook|hotmail|yahoo|icloud|qq|163)\.(?:com|cn)\b")
          registration_detail = re.compile(
              r"(?i)(?:\b(?:state\s+)?entity\s*(?:id|number)\b|"
              r"\b(?:registered|registration)\s+address\b|"
              r"\b\d{4}-\d{7,12}\b|"
              r"\b\d{1,6}\s+(?:N|S|E|W)\s+\w+\s+(?:St|Street|Ave|Avenue|Rd|Road)\b|"
              r"\b[A-Z][a-z]+-registered\b|"
              r"\bregistered\s+(?:in|at)\s+(?!(?:the\s+)?United\s+States\b|USA\b|US\b)[A-Z][a-z]+\b|"
              r"州实体(?:号|编号)|注册地址|注册日期|美国.{1,10}州注册)"
          )
          formation_date = re.compile(
              r"(?i)\b(?:19|20)\d{2}[-/]\d{2}[-/]\d{2}\b|"
              r"\b[A-Z][a-z]+\s+\d{1,2},?\s+(?:19|20)\d{2}\b"
          )
          corporate_context = re.compile(r"(?i)\b(?:LLC|Entity ID|formed|formation)\b|成立日期|注册")
          money = re.compile(r"(?i)(?:US\$|USD\s*|\$)\s*\d[\d,]*(?:\.\d{1,2})?")
          commercial_context = re.compile(r"(?i)(?:annual fee|implementation fee|pricing table|年费|实施费|起售价|企业版年费)")

          findings = []
          for path in docs:
              for index, line in enumerate(path.read_text(encoding="utf-8").splitlines(), start=1):
                  lowered = line.lower()
                  problem = []
                  if creator_identity.search(line):
                      problem.append("personal-creator-linkage")
                  if personal_email.search(line):
                      problem.append("private-email")
                  if registration_detail.search(line):
                      problem.append("registration-detail")
                  if formation_date.search(line) and corporate_context.search(line):
                      problem.append("formation-date")
                  if money.search(line) and commercial_context.search(line):
                      problem.append("public-price")
                  if problem:
                      findings.append(f"{path}:{index} ({','.join(problem)})")
          for item in findings:
              print("FAIL " + item, file=sys.stderr)
          if findings:
              sys.exit(1)
          print(f"PASS: {len(docs)} company-facing documents meet public privacy policy")
          PY
