name: Cloudflare Static Deploy Dry Run

on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - 'assets/**'
      - 'data/**'
      - 'i18n/**'
      - '_headers'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'manifest.webmanifest'
      - 'sw.js'
      - '404.html'
      - 'wrangler.jsonc'
      - '.assetsignore'
      - 'package.json'
      - '.github/workflows/cloudflare-dry-run.yml'
  pull_request:
    paths:
      - '*.html'
      - 'assets/**'
      - 'data/**'
      - 'i18n/**'
      - '_headers'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'manifest.webmanifest'
      - 'sw.js'
      - '404.html'
      - 'wrangler.jsonc'
      - '.assetsignore'
      - 'package.json'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install pinned Wrangler
        run: npm install --no-audit --no-fund
      - name: Validate Cloudflare deployment bundle
        run: npx wrangler deploy --dry-run --outdir .wrangler-dry-run
      - name: Validate public JSON and sitemap
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for p in Path('data').rglob('*.json'):
              json.loads(p.read_text(encoding='utf-8'))
          for p in Path('i18n').rglob('*.json'):
              json.loads(p.read_text(encoding='utf-8'))
          json.loads(Path('manifest.webmanifest').read_text(encoding='utf-8'))
          ET.parse('sitemap.xml')
          print('Static payload validation passed')
          PY
